version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opspilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot_password
      POSTGRES_DB: opspilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opspilot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: opspilot_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://opspilot:opspilot_password@postgres:5432/opspilot
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=opspilot-production-secret-key-change-me
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=opspilot-docs
      - MOCK_AI_PROVIDER=true
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot_worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://opspilot:opspilot_password@postgres:5432/opspilot
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=opspilot-production-secret-key-change-me
      - MOCK_AI_PROVIDER=true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opspilot_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
